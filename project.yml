name: NotchDeck
options:
  bundleIdPrefix: com.notchdeck
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  NotchDeck:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NotchDeck
        excludes:
          - "**/*.md"
    resources: []
    dependencies:
      - target: notchdeck-agent-hook
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notchdeck.app
        PRODUCT_NAME: NotchDeck
        INFOPLIST_FILE: NotchDeck/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotchDeck/Resources/NotchDeck.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    info:
      path: NotchDeck/Resources/Info.plist
      properties:
        CFBundleName: NotchDeck
        CFBundleDisplayName: NotchDeck
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSCameraUsageDescription: "NotchDeck shows a live camera preview in the Mirror module. Video never leaves your Mac and is never recorded."
        NSAppleEventsUsageDescription: "NotchDeck uses Automation to bring the exact terminal tab running your agent to the front. It only selects and raises the existing window — it never runs commands."
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false

  notchdeck-agent-hook:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - AgentHook
      - path: NotchDeck/Agents/Terminal/TerminalAgentProtocol.swift
    settings:
      base:
        PRODUCT_NAME: notchdeck-agent-hook
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"

  NotchDeckTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - NotchDeckTests
    dependencies:
      - target: NotchDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notchdeck.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  NotchDeck:
    build:
      targets:
        NotchDeck: all
        NotchDeckTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - NotchDeckTests
    archive:
      config: Release
