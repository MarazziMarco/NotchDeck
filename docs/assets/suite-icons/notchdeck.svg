<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- Suite icon, direction B ("famiglia a colori"): shared tile, light and glyph style; one hue per app. -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA64D"/><stop offset="1" stop-color="#F0541E"/></linearGradient>
<filter id="tile" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
<filter id="glyph" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".25"/></filter>
</defs>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#tile)"/>
<rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="3"/>
<g filter="url(#glyph)">
<rect x="232" y="296" width="560" height="430" rx="78" fill="none" stroke="rgba(255,255,255,.62)" stroke-width="34"/>
<path d="M402 296 h220 v34 a40 40 0 0 1 -40 40 h-140 a40 40 0 0 1 -40 -40z" fill="rgba(255,255,255,.62)"/>
<rect x="337" y="404" width="350" height="128" rx="64" fill="#FFFFFF"/>
<rect x="377" y="566" width="270" height="34" rx="17" fill="rgba(255,255,255,.62)" opacity=".8"/>
<rect x="417" y="626" width="190" height="34" rx="17" fill="rgba(255,255,255,.62)" opacity=".55"/>
</g>
</svg>
