<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- Suite icon, direction B ("famiglia a colori"): shared tile, light and glyph style; one hue per app. -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46DDD6"/><stop offset="1" stop-color="#1688B0"/></linearGradient>
<filter id="tile" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
<filter id="glyph" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".25"/></filter>
</defs>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#tile)"/>
<rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="3"/>
<g filter="url(#glyph)">
<rect x="262" y="262" width="300" height="300" rx="64" fill="#FFFFFF"/>
<rect x="602" y="262" width="160" height="110" rx="40" fill="rgba(255,255,255,.62)"/>
<rect x="602" y="412" width="160" height="150" rx="40" fill="rgba(255,255,255,.62)"/>
<rect x="262" y="602" width="160" height="160" rx="40" fill="rgba(255,255,255,.62)"/>
<rect x="412" y="602" width="160" height="160" rx="40" fill="rgba(255,255,255,.62)"/>
<rect x="602" y="602" width="160" height="160" rx="40" fill="rgba(255,255,255,.62)"/>

</g>
</svg>
